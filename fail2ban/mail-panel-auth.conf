# Fail2ban filter per FreeBSD-Mail-Panel
#
# Installazione:
#   1. Copia questo file su:
#        /usr/local/etc/fail2ban/filter.d/daemoxcp-mail-auth.conf
#
#   2. Aggiungi una jail su /usr/local/etc/fail2ban/jail.local:
#
#        [daemoxcp-mail-auth]
#        enabled  = true
#        filter   = daemoxcp-mail-auth
#        logpath  = /var/log/daemoxcp-mail-auth.log
#        port     = http,https,2096   # 2096 è la porta del pannello, modifica se serve
#        maxretry = 5
#        findtime = 600                # 10 minuti
#        bantime  = 3600               # 1 ora
#        backend  = auto
#
#   3. service fail2ban restart
#
# Il pannello scrive su /var/log/daemoxcp-mail-auth.log linee del tipo:
#   2026-05-08T12:34:56 [LOGIN_FAILURE] ip=1.2.3.4 user=admin details="..."
#
# Eventi che attivano un fail (count contro maxretry):
#   - LOGIN_FAILURE       (password sbagliata)
#   - LOGIN_2FA_FAILURE   (codice 2FA sbagliato)
#   - LOGIN_INVALID_INPUT (formato username/password invalido — possibile fuzzing)
#   - LOGIN_BLOCKED       (rate limit interno già scattato)
#   - CSRF_FAILURE        (richiesta senza token CSRF valido — bot/script)
#   - SSL_CERT_*_FAILED   (tentativo di emissione cert fallito — possibile abuso API)
#   - FAIL2BAN_*_FAILED   (tentativo di gestione ban fallito)
#   - PASSKEY_REGISTER_FAILED
#   - 2FA_*_FAILED
#   - ADMIN_PASSWORD_CHANGE_FAILED

[Definition]

# Cattura l'IP del client dall'attributo ip=...
# Il regex assume il formato: TIMESTAMP [ACTION] ip=IP user=... details="..."
failregex = ^\S+ \[(?:LOGIN_FAILURE|LOGIN_2FA_FAILURE|LOGIN_INVALID_INPUT|LOGIN_BLOCKED|CSRF_FAILURE|SSL_CERT_[A-Z_]+_FAILED|FAIL2BAN_[A-Z_]+_FAILED|PASSKEY_REGISTER_FAILED|2FA_[A-Z_]+_FAILED|ADMIN_PASSWORD_CHANGE_FAILED)\] ip=<HOST>

# Eventi positivi che NON contano come fail (whitelist regex)
ignoreregex = ^\S+ \[(?:LOGIN_SUCCESS|PASSKEY_LOGIN_SUCCESS|DOMAIN_CREATED|DOMAIN_UPDATED|DOMAIN_DELETED|ALIAS_CREATED|ALIAS_DELETED|SSL_CERT_RENEWED|SSL_CERT_ISSUED_HTTP01|SSL_CERT_ISSUED_DNS01|SSL_CERT_DEPLOYED|SSL_CERT_INSTALLED_MANUAL|SSL_AUTO_RENEWAL_SETTINGS_CHANGED|SSL_MANUAL_CHECK_TRIGGERED|FAIL2BAN_IP_BANNED|FAIL2BAN_IP_UNBANNED|2FA_ENABLED|2FA_DISABLED|2FA_BACKUP_CODES_REGENERATED|PASSKEY_REGISTERED|PASSKEY_DELETED|ADMIN_PASSWORD_CHANGED|HOSTNAME_CHANGED|ROUNDCUBE_DOMAIN_CHANGED|ROUNDCUBE_SSL_UPDATED)\]

# Date format usato dal pannello (ISO 8601 locale)
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
