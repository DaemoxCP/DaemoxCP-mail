            <div class="card mt-4">
                <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <span><i class="fas fa-cloud-arrow-up me-2" aria-hidden="true"></i><strong>{{t:ad.title}}</strong>
                        <span class="small text-muted ms-2">{{t:ad.subtitle}}</span></span>

                    <p class="small text-muted mb-2">{{t:ad.intro3.html}}</p>
