            <!-- acme.sh, which Let's Encrypt certificates require: on a clean install it is not there (finding 247) -->
            <div class="card mb-4 border-primary d-none" id="acmeCard" tabindex="-1">
                <div class="card-header"><i class="fas fa-key me-2" aria-hidden="true"></i><strong>{{t:acm.title}}</strong></div>
                <div class="card-body">
                    <p class="small mb-2">{{t:acm.intro.html}}</p>
                    <label for="acmeEmail" class="form-label small fw-bold mb-1">{{t:acm.emailLabel}}</label>
                    <input type="email" id="acmeEmail" class="form-control mb-1" maxlength="254" autocomplete="email"
                           inputmode="email" required aria-describedby="acmeEmailHelp">
                    <div id="acmeEmailHelp" class="small text-muted mb-2">{{t:acm.emailHelp}}</div>
                    <button type="button" class="btn btn-primary touch-target" id="acmeGo" data-on-click="acmeInstall()">
                        <i class="fas fa-download me-1" aria-hidden="true"></i>{{t:acm.go}}</button>
                    <div id="acmeOutcome" class="mt-2" role="status" aria-live="polite"></div>
                </div>
            </div>
